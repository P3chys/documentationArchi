name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels its older run; runs on main always finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    # The platform independent engine, on every OS the analysts use.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5
      - shell: bash
        run: ./gradlew :core:build -ParchiHome=none

  plugin:
    # The plugin compiles and runs its tests against the jars of an Archi installation, so download a pinned release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5
      - id: archi
        uses: ./.github/actions/setup-archi
      - run: ./gradlew build -ParchiHome="${{ steps.archi.outputs.home }}"
      - uses: actions/upload-artifact@v4
        with:
          name: documentationArchi-plugin
          path: build/dist/*.archiplugin
